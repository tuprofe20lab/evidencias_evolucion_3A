<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Three.js & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #020b06; /* Deep forest dark green */
            font-family: 'Outfit', 'Inter', sans-serif; 
            color: #ffffff;
            user-select: none;
        }
        
        #matrix-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            opacity: 0.25;
            z-index: 1;
        }

        .perspective-grid {
            position: absolute;
            bottom: -18%;
            left: -50%;
            width: 200%;
            height: 65vh;
            background-image: 
                linear-gradient(rgba(16, 185, 129, 0.15) 1px, transparent 1px), /* Emerald green tint */
                linear-gradient(90deg, rgba(16, 185, 129, 0.15) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: perspective(650px) rotateX(65deg);
            transform-origin: bottom center;
            pointer-events: none;
            opacity: 0.6;
            z-index: 2;
        }

        .ambient-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 30%, rgba(16, 185, 129, 0.1) 0%, rgba(2, 11, 6, 0.95) 75%);
            pointer-events: none;
            z-index: 2;
        }

        #three-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            opacity: 0.85;
            pointer-events: none;
        }

        /* Styling variables */
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Animations */
        @keyframes robot-celebrate {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-14px) rotate(-6deg) scale(1.08); }
            75% { transform: translateY(-14px) rotate(6deg) scale(1.08); }
        }
        .animate-robot-celebrate { animation: robot-celebrate 0.5s ease-in-out infinite; }

        @keyframes robot-sad {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            20% { transform: translateX(-8px) rotate(-4deg); }
            40% { transform: translateX(8px) rotate(4deg); }
            60% { transform: translateX(-6px) rotate(-2deg); }
            80% { transform: translateX(6px) rotate(2deg); }
        }
        .animate-robot-sad { animation: robot-sad 0.7s ease-in-out infinite; }

        @keyframes robot-think {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-5px) rotate(-3deg); }
        }
        .animate-robot-think { animation: robot-think 2s ease-in-out infinite; }

        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(2, 44, 34, 0.5); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>

        const SoundEngine = {
            ctx: null,
            isMuted: false,
            bgmPlaying: false,
            bgmTimer: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.startBGM();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            },
            toggleMute(m) { this.isMuted = m; },
            playTone(freq, type, duration, vol = 0.65) {
                if (!this.ctx || this.isMuted) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            },
            playBGMNote(freq, type = 'sine', vol = 0.05, duration = 2.5) {
                if (!this.ctx || this.isMuted) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    
                    // Ataque suave y desvanecimiento lento (estilo piano/arpa clásica)
                    gain.gain.setValueAtTime(0, this.ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime + 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch(e){}
            },
            startBGM() {
                if (this.bgmPlaying) return;
                this.bgmPlaying = true;
                
                // Secuencia de acordes clásica, suave e inspiradora (Do Mayor, Sol Mayor, La Menor, Fa Mayor)
                const seq = [
                    261.63, 329.63, 392.00, 523.25, // Do Mayor (C)
                    293.66, 392.00, 493.88, 587.33, // Sol Mayor (G)
                    220.00, 261.63, 329.63, 440.00, // La Menor (Am)
                    261.63, 349.23, 440.00, 523.25  // Fa Mayor (F)
                ];
                let i = 0;
                
                const loop = () => {
                    if (!this.bgmPlaying) return;
                    
                    if (!this.isMuted && this.ctx && this.ctx.state === 'running') {
                        // Tono principal suave y melódico
                        this.playBGMNote(seq[i], 'sine', 0.06, 2.5);
                        // Tono de apoyo con un poco más de cuerpo, una octava más abajo
                        this.playBGMNote(seq[i] / 2, 'triangle', 0.03, 2.5); 
                    }
                    
                    i = (i + 1) % seq.length;
                    this.bgmTimer = setTimeout(loop, 450); // Ritmo tranquilo para estudiar
                };
                loop();
            },
            hover() { this.playTone(900, 'sine', 0.05, 0.1); },
            click() { this.playTone(800, 'square', 0.05, 0.2); },
            tick() { this.playTone(1000, 'sine', 0.05, 0.05); },
            success() {
                this.playTone(400, 'sine', 0.1, 0.3);
                setTimeout(() => this.playTone(600, 'sine', 0.1, 0.3), 100);
                setTimeout(() => this.playTone(800, 'sine', 0.3, 0.3), 200);
            }
        };

        const BioParticlesBackground = () => {
            const canvasRef = useRef(null);
            
            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animId;
                let w = canvas.width = window.innerWidth;
                let h = canvas.height = window.innerHeight;
                
                const handleResize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
                window.addEventListener('resize', handleResize);

                const symbols = ['🧬', '🦴', '🌍', '🐒', '👨‍🔬', 'Fósil', 'ADN', 'Evolución'];
                const colors = ['#10b981', '#34d399', '#059669', '#fbbf24', '#38bdf8'];
                
                const particles = Array.from({ length: 60 }).map(() => ({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5,
                    r: Math.random() * 4 + 2,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    text: Math.random() > 0.75 ? symbols[Math.floor(Math.random() * symbols.length)] : null,
                    pulse: Math.random() * Math.PI * 2
                }));

                const draw = () => {
                    ctx.clearRect(0, 0, w, h);
                    
                    for (let i = 0; i < particles.length; i++) {
                        for (let j = i + 1; j < particles.length; j++) {
                            const dx = particles[i].x - particles[j].x;
                            const dy = particles[i].y - particles[j].y;
                            const dist = Math.sqrt(dx*dx + dy*dy);
                            if (dist < 120) {
                                ctx.beginPath();
                                ctx.moveTo(particles[i].x, particles[i].y);
                                ctx.lineTo(particles[j].x, particles[j].y);
                                ctx.strokeStyle = particles[i].color;
                                ctx.globalAlpha = 0.1 * (1 - dist/120);
                                ctx.stroke();
                            }
                        }
                    }

                    particles.forEach(p => {
                        p.x += p.vx;
                        p.y += p.vy;
                        p.pulse += 0.03;

                        if (p.x < 0 || p.x > w) p.vx *= -1;
                        if (p.y < 0 || p.y > h) p.vy *= -1;

                        ctx.globalAlpha = 0.3 + Math.sin(p.pulse) * 0.3;
                        
                        if (p.text) {
                            ctx.font = 'bold 18px "JetBrains Mono"';
                            ctx.fillStyle = p.color;
                            ctx.textAlign = 'center';
                            ctx.fillText(p.text, p.x, p.y);
                        } else {
                            ctx.beginPath();
                            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                            ctx.fillStyle = p.color;
                            ctx.fill();
                        }
                    });
                    
                    ctx.globalAlpha = 1;
                    animId = requestAnimationFrame(draw);
                };
                draw();
                return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', handleResize); };
            }, []);

            return <canvas ref={canvasRef} className="absolute inset-0 z-0 pointer-events-none opacity-60" />;
        };

        const BioSimulation3D = ({ simRef }) => {
            const mountRef = useRef(null);

            useEffect(() => {
                if (!mountRef.current) return;
                
                const scene = new THREE.Scene(); 
                scene.fog = new THREE.FogExp2(0x020b06, 0.012);
                
                const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
                camera.position.set(0, 0, 40); 
                
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
                mountRef.current.appendChild(renderer.domElement);

                scene.add(new THREE.AmbientLight(0xffffff, 0.8));
                
                const colorNormal = new THREE.Color(0x10b981); // Emerald
                let currentColor = colorNormal.clone();

                const MAX_NODES = 250;
                let activeNodes = 120;
                let connectionThreshold = 18;
                let simSpeed = 1.0;

                const nodesGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(MAX_NODES * 3);
                const velocities = [];

                for (let i = 0; i < MAX_NODES; i++) {
                    const r = 18;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    
                    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                    positions[i * 3 + 2] = r * Math.cos(phi);

                    velocities.push(new THREE.Vector3(
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1,
                        (Math.random() - 0.5) * 0.1
                    ));
                }

                nodesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                nodesGeometry.setDrawRange(0, activeNodes);

                const materialSphere = new THREE.PointsMaterial({
                    color: currentColor,
                    size: 1.2,
                    transparent: true,
                    opacity: 0.9,
                    sizeAttenuation: true
                });
                
                const pointCloud = new THREE.Points(nodesGeometry, materialSphere);
                scene.add(pointCloud);

                // Lines structure
                const linesGeometry = new THREE.BufferGeometry();
                const maxLines = (MAX_NODES * (MAX_NODES - 1)) / 2;
                const linePositions = new Float32Array(maxLines * 6);
                linesGeometry.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
                
                const lineMaterial = new THREE.LineBasicMaterial({
                    color: currentColor,
                    transparent: true,
                    opacity: 0.25
                });
                const linesMesh = new THREE.LineSegments(linesGeometry, lineMaterial);
                scene.add(linesMesh);

                let mouseX = 0, mouseY = 0;
                const handleMouseMove = (e) => { 
                    mouseX = ((e.clientX / window.innerWidth) * 2 - 1) * 8; 
                    mouseY = ((e.clientY / window.innerHeight) * 2 - 1) * 8; 
                };
                document.addEventListener('mousemove', handleMouseMove);
                
                const handleResize = () => { 
                    camera.aspect = window.innerWidth / window.innerHeight; 
                    camera.updateProjectionMatrix(); 
                    renderer.setSize(window.innerWidth, window.innerHeight); 
                };
                window.addEventListener('resize', handleResize);

                simRef.current = {
                    pulse: () => {
                        gsap.to(camera.position, { z: 35, duration: 0.5, yoyo: true, repeat: 1 });
                    }
                };

                let animId;
                const anim = () => {
                    animId = requestAnimationFrame(anim);
                    
                    const time = Date.now() * 0.0005;
                    camera.position.x += (mouseX + Math.sin(time)*4 - camera.position.x) * 0.02;
                    camera.position.y += (-mouseY - camera.position.y) * 0.02;
                    camera.lookAt(0,0,0);

                    const posAttr = nodesGeometry.attributes.position;
                    let lineIndex = 0;

                    for (let i = 0; i < activeNodes; i++) {
                        let vx = velocities[i].x * simSpeed;
                        let vy = velocities[i].y * simSpeed;
                        let vz = velocities[i].z * simSpeed;

                        let px = posAttr.getX(i) + vx;
                        let py = posAttr.getY(i) + vy;
                        let pz = posAttr.getZ(i) + vz;

                        // Soft boundary constraints
                        const distToCenter = Math.sqrt(px*px + py*py + pz*pz);
                        if (distToCenter > 22) {
                            velocities[i].x -= (px / distToCenter) * 0.02;
                            velocities[i].y -= (py / distToCenter) * 0.02;
                            velocities[i].z -= (pz / distToCenter) * 0.02;
                        }

                        posAttr.setXYZ(i, px, py, pz);

                        // Connections
                        for (let j = i + 1; j < activeNodes; j++) {
                            const px2 = posAttr.getX(j);
                            const py2 = posAttr.getY(j);
                            const pz2 = posAttr.getZ(j);

                            const distSq = (px-px2)**2 + (py-py2)**2 + (pz-pz2)**2;
                            if (distSq < connectionThreshold * connectionThreshold) {
                                linePositions[lineIndex++] = px;
                                linePositions[lineIndex++] = py;
                                linePositions[lineIndex++] = pz;
                                linePositions[lineIndex++] = px2;
                                linePositions[lineIndex++] = py2;
                                linePositions[lineIndex++] = pz2;
                            }
                        }
                    }

                    posAttr.needsUpdate = true;
                    linesGeometry.setDrawRange(0, lineIndex / 3);
                    linesGeometry.attributes.position.needsUpdate = true;
                    
                    pointCloud.rotation.y += 0.001 * simSpeed;
                    linesMesh.rotation.y += 0.001 * simSpeed;

                    renderer.render(scene, camera);
                };
                anim();

                return () => {
                    cancelAnimationFrame(animId);
                    window.removeEventListener('resize', handleResize);
                    document.removeEventListener('mousemove', handleMouseMove);
                    if (mountRef.current) mountRef.current.innerHTML = '';
                };
            }, []);

            return <div ref={mountRef} id="three-container" />;
        };

        const ProfeBot = ({ color = '#10b981', mood = 'idle', className="w-full h-full" }) => {
            let animClass = '';
            if (mood === 'celebrate' || mood === 'happy') animClass = 'animate-robot-celebrate';
            else if (mood === 'sad') animClass = 'animate-robot-sad';
            else if (mood === 'thinking') animClass = 'animate-robot-think';
            const orbColor = (mood === 'celebrate' || mood === 'happy') ? '#34d399' : (mood === 'sad' ? '#ef4444' : color);

            return (
                <svg viewBox="0 0 100 100" className={`${className} ${animClass}`} style={{ filter: 'drop-shadow(0 6px 14px rgba(0,0,0,0.6))' }}>
                    <defs>
                        <radialGradient id={`glow-${color.replace('#','')}`} cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stopColor="#fff" stopOpacity="1" />
                            <stop offset="40%" stopColor={orbColor} stopOpacity="0.8" />
                            <stop offset="100%" stopColor={orbColor} stopOpacity="0" />
                        </radialGradient>
                    </defs>
                    {/* Antenna */}
                    <rect x="47" y="10" width="6" height="14" rx="3" fill="#94a3b8" />
                    <circle cx="50" cy="11" r="14" fill={`url(#glow-${color.replace('#','')})`} />
                    <circle cx="50" cy="11" r="6.5" fill={orbColor} />
                    <circle cx="48" cy="9" r="2.5" fill="#fff" />
                    {/* Ears */}
                    <rect x="8" y="32" width="16" height="9" rx="4.5" fill="#cbd5e1" stroke="#475569" strokeWidth="2.5" transform="rotate(-32 16 36)" />
                    <rect x="76" y="32" width="16" height="9" rx="4.5" fill="#cbd5e1" stroke="#475569" strokeWidth="2.5" transform="rotate(32 84 36)" />
                    {/* Head */}
                    <rect x="18" y="22" width="64" height="64" rx="22" fill="#e2e8f0" stroke="#475569" strokeWidth="2.5" />
                    <rect x="21" y="25" width="58" height="58" rx="19" fill="#f8fafc" />
                    {/* Screen */}
                    <rect x="27" y="31" width="46" height="46" rx="14" fill="#022c22" stroke="#064e3b" strokeWidth="2" />
                    
                    {/* Expressions */}
                    {(mood === 'idle' || mood === 'happy' || mood === 'celebrate') && (
                        <g>
                            <path d="M 33 49 A 6 6 0 0 1 45 49 Z" fill={color} />
                            <path d="M 55 49 A 6 6 0 0 1 67 49 Z" fill={color} />
                            <circle cx="34" cy="56" r="2.8" fill="#f43f5e" opacity="0.6" />
                            <circle cx="66" cy="56" r="2.8" fill="#f43f5e" opacity="0.6" />
                            <path d="M 37 56 Q 50 75 63 56 Z" fill="#ff6b81" />
                        </g>
                    )}
                    {mood === 'sad' && (
                        <g>
                            <path d="M 34 45 L 44 53 M 44 45 L 34 53" stroke={color} strokeWidth="3" strokeLinecap="round" />
                            <path d="M 56 45 L 66 53 M 66 45 L 56 53" stroke={color} strokeWidth="3" strokeLinecap="round" />
                            <path d="M 40 67 Q 50 58 60 67" stroke="#ff6b81" strokeWidth="3" strokeLinecap="round" fill="none" />
                        </g>
                    )}
                    {mood === 'thinking' && (
                        <g>
                            <circle cx="39" cy="48" r="5" fill={color} />
                            <circle cx="41" cy="46" r="2" fill="#fff" />
                            <circle cx="61" cy="48" r="5" fill={color} />
                            <circle cx="63" cy="46" r="2" fill="#fff" />
                            <circle cx="50" cy="64" r="3.5" fill="#ff6b81" />
                        </g>
                    )}
                </svg>
            );
        };

        function App() {
            const [screen, setScreen] = useState('START'); // START, PLAY, WAIT_REVIEW, REVIEW, END
            const [stepIndex, setStepIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(60);
            const [isMuted, setIsMuted] = useState(false);

            const simRef = useRef(null);
            const currentStep = QuestionsDB[stepIndex];

            useEffect(() => {
                SoundEngine.init();
                
                // Para evadir el bloqueo de autoplay del navegador: 
                // Iniciamos el ambiente sonoro al PRIMER clic que el usuario haga en toda la página.
                const startAudioOnInteraction = () => {
                    SoundEngine.startAmbient();
                    document.removeEventListener('click', startAudioOnInteraction);
                };
                document.addEventListener('click', startAudioOnInteraction);
                
                return () => document.removeEventListener('click', startAudioOnInteraction);
            }, []);

            // Cronómetro de 1 minuto (60 seg) por pregunta en modo PLAY
            useEffect(() => {
                let interval;
                if (screen === 'PLAY' && timeLeft > 0) {
                    interval = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 6 && !isMuted) SoundEngine.tick();
                            return prev - 1;
                        });
                    }, 1000);
                } else if (screen === 'PLAY' && timeLeft === 0) {
                    handleNextQuestion();
                }
                return () => clearInterval(interval);
            }, [screen, timeLeft, isMuted]);

            const toggleMute = () => { 
                setIsMuted(!isMuted); 
                SoundEngine.toggleMute(!isMuted); 
            };

            const startEvaluation = () => {
                SoundEngine.init(); // Asegurarnos de que el contexto de audio arranque al hacer click
                SoundEngine.click();
                setStepIndex(0);
                setTimeLeft(60);
                setScreen('PLAY');
            };

            const handleNextQuestion = () => {
                if (stepIndex < QuestionsDB.length - 1) {
                    setStepIndex(prev => prev + 1);
                    setTimeLeft(60);
                    SoundEngine.success(); 
                    if (simRef.current) simRef.current.pulse();
                } else {
                    setScreen('WAIT_REVIEW');
                }
            };

            const handleNextReview = () => {
                SoundEngine.click();
                if (stepIndex < QuestionsDB.length - 1) {
                    setStepIndex(prev => prev + 1);
                } else {
                    setScreen('END');
                }
            };

            const renderPlay = () => (
                <main className="flex-1 p-8 flex flex-col md:flex-row gap-10 relative z-10 w-full h-full max-w-[1920px] mx-auto pt-32">
                    {/* PANEL IZQUIERDO: CRONÓMETRO */}
                    <div className="w-full md:w-4/12 flex flex-col gap-8 h-full z-20">
                        <div className="bg-[#03150d]/90 border border-emerald-900/50 p-10 rounded-[2.5rem] flex-1 flex flex-col items-center justify-center shadow-xl backdrop-blur-sm relative overflow-hidden">
                            <div className={`absolute inset-0 bg-red-500/10 transition-opacity duration-1000 ${timeLeft <= 10 ? 'opacity-100 animate-pulse' : 'opacity-0'}`}></div>
                            
                            <h3 className="text-2xl font-black text-emerald-600 tracking-[0.2em] uppercase mb-8 relative z-10">Tiempo Restante</h3>
                            
                            <div className={`text-[130px] font-mono font-black tabular-nums transition-colors leading-none relative z-10 ${timeLeft <= 10 ? 'text-red-500' : 'text-emerald-400 drop-shadow-[0_0_20px_rgba(16,185,129,0.4)]'}`}>
                                {timeLeft.toString().padStart(2, '0')}
                            </div>
                            
                            <p className="mt-10 text-slate-400 text-center text-xl max-w-xs relative z-10">
                                Selecciona la alternativa correcta en tu ficha. La evaluación avanzará automáticamente.
                            </p>
                            
                            <button onClick={() => {SoundEngine.click(); handleNextQuestion();}} className="mt-8 px-6 py-3 bg-[#051c11] hover:bg-[#0a2e1f] text-emerald-400 border border-emerald-900/50 hover:border-emerald-500/50 rounded-full font-bold uppercase tracking-widest transition-all shadow-md active:scale-95 relative z-10">
                                Saltar Tiempo ⏭
                            </button>
                        </div>
                    </div>

                    {/* PANEL DERECHO: PREGUNTA */}
                    <div className="w-full md:w-8/12 flex flex-col h-full z-20">
                        <div className="bg-[#03150d]/90 border border-emerald-900/50 p-12 md:p-16 rounded-[3rem] flex-1 flex flex-col justify-center relative shadow-xl backdrop-blur-sm">
                            <div className="absolute top-8 right-10 text-sm font-black tracking-[0.25em] text-emerald-500/60 uppercase">Pregunta {stepIndex + 1}/10</div>
                            <h4 className="text-3xl md:text-5xl font-bold mb-14 text-left text-white leading-tight">{currentStep.q}</h4>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {currentStep.opts.map((optText, idx) => (
                                    <div key={idx} className="bg-[#061e14] border-2 border-emerald-900/60 p-6 rounded-3xl text-left shadow-md flex items-center gap-6">
                                        <span className="w-14 h-14 rounded-xl bg-[#03150d] border border-emerald-800/50 text-emerald-400 font-black text-2xl flex items-center justify-center shrink-0 shadow-inner">
                                            {['A', 'B', 'C', 'D'][idx]}
                                        </span>
                                        <span className="text-xl md:text-2xl font-medium text-slate-200 leading-snug">{optText}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </main>
            );

            const renderReview = () => (
                <main className="flex-1 p-8 flex flex-col md:flex-row gap-10 relative z-10 w-full h-full max-w-[1920px] mx-auto pt-32">
                    {/* PANEL IZQUIERDO: RETROALIMENTACIÓN */}
                    <div className="w-full md:w-5/12 flex flex-col h-full z-20">
                        <div className="bg-[#03150d]/90 border border-emerald-900/50 p-10 rounded-[2.5rem] flex-1 flex flex-col shadow-xl backdrop-blur-sm">
                            <div className="flex justify-between items-center mb-8 pb-6 border-b border-emerald-900/50">
                                <span className="font-black text-emerald-400 text-2xl tracking-widest uppercase">Solucionario</span>
                                <span className="text-sm bg-emerald-900/50 border border-emerald-500 text-emerald-300 font-bold px-5 py-2 rounded-full uppercase">Pregunta {stepIndex + 1}/10</span>
                            </div>
                            
                            <div className="flex-1 flex flex-col items-center justify-center text-center">
                                <div className="w-40 h-40 mb-8"><ProfeBot color={COLORS.emerald} mood="celebrate" /></div>
                                <h3 className="text-2xl font-bold text-emerald-500 mb-6 uppercase tracking-widest">Retroalimentación</h3>
                                <p className="text-2xl text-white leading-relaxed font-normal">{currentStep.fb}</p>
                            </div>
                            
                            <button onClick={handleNextReview} className="mt-8 w-full py-6 px-8 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-black font-black text-2xl rounded-2xl active:scale-95 transition-all uppercase tracking-wider shadow-[0_0_30px_rgba(16,185,129,0.4)]">
                                {stepIndex < QuestionsDB.length - 1 ? 'Siguiente Pregunta ⏭' : 'Finalizar Revisión'}
                            </button>
                        </div>
                    </div>

                    {/* PANEL DERECHO: RESPUESTA ILUMINADA */}
                    <div className="w-full md:w-7/12 flex flex-col h-full z-20">
                        <div className="bg-[#03150d]/90 border border-emerald-900/50 p-12 md:p-16 rounded-[3rem] flex-1 flex flex-col justify-center relative shadow-xl backdrop-blur-sm">
                            <h4 className="text-3xl md:text-5xl font-bold mb-14 text-left text-white leading-tight">{currentStep.q}</h4>
                            
                            <div className="grid grid-cols-1 gap-6">
                                {currentStep.opts.map((optText, idx) => {
                                    const isCorrect = idx === currentStep.ans;
                                    return (
                                        <div key={idx} className={`border-4 p-6 rounded-3xl text-left shadow-lg flex items-center gap-6 transition-all ${isCorrect ? 'bg-emerald-900/40 border-emerald-400 transform scale-[1.02]' : 'bg-[#061e14] border-emerald-900/20 opacity-40'}`}>
                                            <span className={`w-14 h-14 rounded-xl font-black text-2xl flex items-center justify-center shrink-0 ${isCorrect ? 'bg-emerald-400 text-black shadow-[0_0_20px_rgba(52,211,153,0.6)]' : 'bg-[#03150d] text-slate-500 border border-emerald-900/50'}`}>
                                                {['A', 'B', 'C', 'D'][idx]}
                                            </span>
                                            <span className={`text-xl md:text-3xl font-medium leading-snug ${isCorrect ? 'text-white' : 'text-slate-400'}`}>{optText}</span>
                                            {isCorrect && (
                                                <div className="ml-auto">
                                                    <svg className="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </main>
            );

            return (
                <div className="w-full h-screen bg-[#020b06] text-white flex flex-col overflow-hidden relative font-sans">
                    <BioSimulation3D simRef={simRef} />
                    <div className="perspective-grid" />
                    <div className="ambient-glow" />

                    {(screen !== 'START' && screen !== 'END' && screen !== 'WAIT_REVIEW') && (
                        <header className="absolute top-0 w-full h-28 bg-[#020e08]/80 backdrop-blur-xl border-b border-emerald-900/50 px-10 flex items-center justify-between z-40 shadow-lg">
                            <div className="flex flex-col">
                                <h1 className="text-3xl font-black tracking-wider leading-none">
                                    <span className="text-white">TUPROFE20</span> <span className="text-emerald-400">LAB</span>
                                </h1>
                                <span className="text-[12px] font-bold tracking-[0.3em] text-slate-400 mt-2 uppercase">BIOLOGÍA • 3ER AÑO DE SECUNDARIA</span>
                            </div>
                            
                            <div className="flex items-center gap-8">
                                <button onClick={toggleMute} className="w-14 h-14 bg-[#051c11] hover:bg-[#0a2e1f] border border-emerald-900/60 rounded-2xl flex items-center justify-center transition-all">
                                    {isMuted ? <SpeakerXIcon /> : <SpeakerIcon />}
                                </button>
                            </div>
                        </header>
                    )}

                    {screen === 'START' && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center p-6 overflow-hidden">
                            <BioParticlesBackground />
                            <div className="max-w-4xl w-full bg-[#03150d]/95 border border-emerald-500/30 rounded-[3rem] p-16 flex flex-col items-center text-center shadow-[0_0_80px_rgba(16,185,129,0.15)] backdrop-blur-2xl relative z-10">
                                <span className="text-sm font-black tracking-[0.35em] text-emerald-400 uppercase mb-4">TUPROFE20 LAB • CURSO DE BIOLOGÍA</span>
                                <h1 className="text-5xl sm:text-7xl font-black tracking-wider text-white uppercase drop-shadow-[0_0_20px_rgba(16,185,129,0.5)] mb-2">
                                    BIOLOGÍA 3ER AÑO
                                </h1>
                                <h2 className="text-5xl sm:text-6xl font-black uppercase mb-12 bg-gradient-to-r from-emerald-400 via-teal-300 to-green-400 bg-clip-text text-transparent drop-shadow-[0_0_30px_rgba(16,185,129,0.2)]">
                                    EVIDENCIAS DE LA EVOLUCIÓN
                                </h2>
                                <div className="w-48 h-48 mb-12"><ProfeBot color={COLORS.emerald} mood="happy" /></div>
                                <button onClick={startEvaluation} onMouseEnter={() => SoundEngine.hover()} className="w-full max-w-md py-6 px-10 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-black font-black text-2xl rounded-full shadow-[0_0_40px_rgba(16,185,129,0.4)] active:scale-95 transition-all uppercase tracking-widest">
                                    INICIAR EVALUACIÓN
                                </button>
                            </div>
                        </div>
                    )}
                    
                    {screen === 'PLAY' && renderPlay()}
                    
                    {screen === 'WAIT_REVIEW' && (
                        <div className="absolute inset-0 z-50 flex flex-col justify-center items-center p-10 bg-[#020b06]/95 backdrop-blur-xl">
                            <BioParticlesBackground />
                            <div className="max-w-4xl w-full bg-[#03150d]/95 border-2 border-emerald-400 rounded-[3rem] shadow-[0_0_90px_rgba(16,185,129,0.3)] p-20 flex flex-col items-center text-center relative z-10">
                                <h2 className="text-5xl font-black text-white uppercase mb-8">Evaluación Finalizada</h2>
                                <p className="text-3xl text-slate-300 mb-12 font-medium">Alumnos, por favor entreguen sus fichas de respuestas al profesor.</p>
                                <div className="w-56 h-56 mb-12"><ProfeBot color={COLORS.emerald} mood="idle" /></div>
                                <button onClick={() => { SoundEngine.click(); setScreen('REVIEW'); setStepIndex(0); }} onMouseEnter={() => SoundEngine.hover()} className="py-6 px-12 bg-gradient-to-r from-emerald-500 to-teal-500 text-black font-black text-2xl rounded-2xl shadow-[0_0_35px_rgba(16,185,129,0.4)] active:scale-95 uppercase tracking-wider transition-all">
                                    Autorizar Solucionario
                                </button>
                            </div>
                        </div>
                    )}

                    {screen === 'REVIEW' && renderReview()}

                    {screen === 'END' && (
                        <div className="absolute inset-0 z-50 flex flex-col justify-center items-center p-10 bg-[#020b06]/95 backdrop-blur-xl">
                            <div className="max-w-4xl w-full bg-[#03150d] border-2 border-emerald-400 rounded-[3rem] shadow-[0_0_90px_rgba(16,185,129,0.3)] p-20 flex flex-col items-center text-center relative overflow-hidden">
                                <div className="absolute -top-40 -left-40 w-96 h-96 bg-emerald-500/20 blur-[100px] rounded-full pointer-events-none"></div>
                                <h2 className="text-6xl font-black text-white tracking-tight uppercase mb-12 relative z-10">REVISIÓN CONCLUIDA</h2>
                                <div className="w-64 h-64 mb-16 relative z-10"><ProfeBot color={COLORS.emerald} mood="celebrate" /></div>
                                <button onClick={() => window.location.reload()} onMouseEnter={() => SoundEngine.hover()} className="py-6 px-14 bg-gradient-to-r from-emerald-500 to-teal-500 text-black font-black text-2xl rounded-2xl shadow-[0_0_35px_rgba(16,185,129,0.4)] transition-all active:scale-95 uppercase tracking-wider relative z-10">
                                    Regresar al Inicio
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
